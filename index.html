<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>午饭吃什么 · 随机抽取</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('lunch.theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.dataset.theme = saved;
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.dataset.theme = 'dark';
    }
  } catch (e) {}
})();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background .3s ease, color .3s ease;
  }

  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-2: #f7f9fd;
    --text: #171b24;
    --sub: #6b7484;
    --line: rgba(17, 24, 39, .08);
    --brand: #ff6b35;
    --brand-2: #ff9f1c;
    --brand-soft: rgba(255, 107, 53, .10);
    --brand-shadow: rgba(255, 107, 53, .30);
    --shadow-1: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-2: 0 16px 40px rgba(16, 24, 40, .10);
    --glow-1: rgba(255, 107, 53, .18);
    --glow-2: rgba(255, 166, 43, .16);
    --glow-3: rgba(59, 130, 246, .10);
    --input-bg: #ffffff;
  }

  html[data-theme="dark"] {
    --bg: #0e1116;
    --card: #171b22;
    --card-2: #1c212a;
    --text: #e8ecf3;
    --sub: #98a2b3;
    --line: rgba(255, 255, 255, .09);
    --brand: #ff7a45;
    --brand-2: #ffb547;
    --brand-soft: rgba(255, 122, 69, .16);
    --brand-shadow: rgba(255, 122, 69, .26);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-2: 0 18px 44px rgba(0, 0, 0, .45);
    --glow-1: rgba(255, 122, 69, .16);
    --glow-2: rgba(255, 181, 71, .10);
    --glow-3: rgba(59, 130, 246, .14);
    --input-bg: #12161c;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(900px 520px at 10% -10%, var(--glow-1), transparent 62%),
      radial-gradient(820px 520px at 94% 2%, var(--glow-2), transparent 62%),
      radial-gradient(760px 620px at 50% 112%, var(--glow-3), transparent 62%);
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 22px 18px calc(44px + env(safe-area-inset-bottom));
  }

  /* ---------- 头部 ---------- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo {
    width: 44px; height: 44px; flex: none;
    border-radius: 14px;
    display: grid; place-items: center;
    font-size: 22px; line-height: 1;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    box-shadow: 0 8px 20px var(--brand-shadow);
  }
  h1 { font-size: 19px; margin: 0; letter-spacing: .3px; }
  .sub { font-size: 12px; color: var(--sub); margin: 3px 0 0; }
  .icon-btn {
    width: 40px; height: 40px; flex: none;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font-size: 17px; line-height: 1;
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform .16s ease;
    box-shadow: var(--shadow-1);
  }
  .icon-btn:active { transform: scale(.92); }

  /* ---------- 抽取舞台 ---------- */
  .reel-wrap {
    position: relative;
    min-height: 216px;
    padding: 28px 18px 24px;
    border-radius: 24px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--card-2), var(--card));
    box-shadow: var(--shadow-2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    overflow: hidden;
    transition: border-color .3s ease, box-shadow .3s ease;
  }
  .reel-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 62% at 50% -18%, var(--brand-soft), transparent 72%);
  }
  .reel-wrap.done {
    border-color: var(--brand);
    box-shadow: 0 18px 46px var(--brand-shadow);
  }
  .tag {
    position: relative;
    z-index: 1;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--brand);
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--brand-soft);
    font-weight: 600;
  }
  .reel-text {
    position: relative;
    z-index: 1;
    font-size: clamp(32px, 10.5vw, 50px);
    font-weight: 800;
    line-height: 1.16;
    letter-spacing: 1px;
    text-align: center;
    word-break: break-word;
    padding: 0 6px;
    transition: filter .2s ease, opacity .2s ease;
  }
  .reel-text[data-long="1"] { font-size: clamp(22px, 7.4vw, 34px); letter-spacing: 0; }
  .reel-wrap.spinning .reel-text { filter: blur(.6px); opacity: .9; }
  .reel-cat {
    position: relative;
    z-index: 1;
    font-size: 13px;
    color: var(--sub);
    min-height: 18px;
    letter-spacing: .5px;
  }
  @keyframes pop {
    0%   { transform: scale(.84); opacity: .35; }
    55%  { transform: scale(1.09); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .reel-text.pop { animation: pop .52s cubic-bezier(.2, .9, .3, 1.4); }

  .spin-btn {
    width: 100%;
    margin-top: 14px;
    height: 56px;
    border: none;
    border-radius: 18px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    box-shadow: 0 14px 30px var(--brand-shadow);
    transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
  }
  .spin-btn:hover { filter: brightness(1.05); }
  .spin-btn:active { transform: scale(.975); box-shadow: 0 8px 18px var(--brand-shadow); }
  .spin-btn:disabled { opacity: .72; cursor: default; transform: none; }

  .history {
    margin-top: 14px;
    min-height: 20px;
    font-size: 12px;
    color: var(--sub);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }
  .history .h-item {
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
  }

  /* ---------- 选项管理 ---------- */
  .manage {
    margin-top: 26px;
    padding: 18px;
    border-radius: 22px;
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: var(--shadow-2);
  }
  .manage-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .manage-head h2 { font-size: 15px; margin: 0; letter-spacing: .3px; }
  .count { font-size: 12px; color: var(--sub); }

  .add-form { display: flex; gap: 8px; }
  .add-form input[type="text"] {
    flex: 1 1 auto;
    min-width: 0;
    height: 44px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .add-form input[type="text"]:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
  }
  .add-btn {
    height: 44px;
    padding: 0 20px;
    flex: none;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 18px var(--brand-shadow);
    transition: transform .16s ease;
  }
  .add-btn:active { transform: scale(.95); }

  .items {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 8px 8px 8px 13px;
    border-radius: 12px;
    background: var(--card-2);
    border: 1px solid var(--line);
    font-size: 14px;
    color: var(--text);
    line-height: 1.2;
  }
  .item.mine {
    border-color: var(--brand);
    background: var(--brand-soft);
  }
  .item .del {
    width: 22px; height: 22px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--sub);
    font-size: 15px;
    line-height: 1;
    font-family: inherit;
    cursor: pointer;
    display: grid; place-items: center;
    transition: background .16s ease, color .16s ease;
  }
  .item .del:hover { background: rgba(255, 69, 58, .14); color: #ff453a; }

  .empty-tip {
    margin: 16px 0 0;
    font-size: 12px;
    color: var(--sub);
  }

  .manage-foot {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .link-btn {
    padding: 0;
    border: none;
    background: none;
    color: var(--sub);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link-btn:hover { color: var(--brand); }
  .foot-note { font-size: 11px; color: var(--sub); opacity: .8; }

  /* ---------- 提示 ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translate(-50%, 14px);
    padding: 11px 18px;
    border-radius: 999px;
    background: rgba(23, 27, 36, .92);
    color: #fff;
    font-size: 13px;
    white-space: nowrap;
    max-width: 88vw;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 9999;
    backdrop-filter: blur(8px);
  }
  html[data-theme="dark"] #toast { background: rgba(238, 242, 250, .95); color: #12161c; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9998;
  }

  @media (max-width: 360px) {
    .reel-text { font-size: 28px; }
    .wrap { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">🍜</div>
      <div>
        <h1>午饭吃什么</h1>
        <p class="sub">选择困难症的终极解药</p>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" title="切换深色模式" aria-label="切换深色模式">🌙</button>
  </header>

  <section class="stage">
    <div class="reel-wrap" id="reelWrap">
      <div class="tag" id="tag">今天吃</div>
      <div class="reel-text" id="reelText">准备好了吗？</div>
      <div class="reel-cat" id="reelCat">点击下方按钮开始抽取</div>
    </div>
    <button class="spin-btn" id="spinBtn" type="button">开 始 抽 取</button>
    <div class="history" id="history"></div>
  </section>

  <section class="manage">
    <div class="manage-head">
      <h2>我的选项</h2>
      <span class="count" id="poolCount"></span>
    </div>

    <form class="add-form" id="addForm" autocomplete="off">
      <input type="text" id="nameInput" maxlength="20" placeholder="添加一个选项，如：云南米线">
      <button type="submit" class="add-btn">添加</button>
    </form>

    <div class="items" id="items"></div>

    <div class="manage-foot">
      <button class="link-btn" id="restoreBtn" type="button">恢复默认 5 个选项</button>
      <span class="foot-note">自定义选项保存在本机浏览器</span>
    </div>
  </section>
</div>

<canvas id="fx"></canvas>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  /* ================= 数据 ================= */
  var DEFAULT_ITEMS = ['鱼头', '烧鹅', '锅气', '武夷山土菜', '自由活动'];

  var KEY_DATA = 'lunch.options.v2';
  var KEY_LEGACY = 'lunch.picker.v1';
  var KEY_HIST = 'lunch.history.v1';
  var KEY_THEME = 'lunch.theme';

  // state.custom: 自定义选项名数组；state.hidden: 被隐藏的默认选项名数组
  var state = { custom: [], hidden: [] };
  var history = [];
  var spinning = false;

  /* ================= 工具 ================= */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function dedupe(arr) {
    var seen = Object.create(null);
    var out = [];
    arr.forEach(function (v) {
      if (typeof v !== 'string') return;
      var k = v.trim();
      if (!k || seen[k]) return;
      seen[k] = 1;
      out.push(k);
    });
    return out;
  }

  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1900);
  }

  /* ================= 持久化 + 旧数据迁移 ================= */
  function normalizeName(v) {
    // 兼容旧结构 {name: 'xxx', cat: 'xxx'} 或纯字符串
    if (typeof v === 'string') return v.trim();
    if (v && typeof v === 'object' && typeof v.name === 'string') return v.name.trim();
    return '';
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(KEY_DATA);
      if (raw) {
        var o = JSON.parse(raw) || {};
        if (Array.isArray(o.custom)) state.custom = dedupe(o.custom.map(normalizeName));
        if (Array.isArray(o.hidden)) state.hidden = dedupe(o.hidden.map(normalizeName));
        return;
      }
      migrateLegacy();
    } catch (e) { /* 本地存储不可用时降级为内存态 */ }
  }

  function migrateLegacy() {
    try {
      var raw = localStorage.getItem(KEY_LEGACY);
      if (!raw) return;
      var o = JSON.parse(raw) || {};
      var legacyCustom = [];
      (o.custom || []).forEach(function (x) { legacyCustom.push(normalizeName(x)); });
      var legacyHidden = [];
      (o.hidden || []).forEach(function (x) {
        if (typeof x !== 'string') return;
        var parts = x.split('::');
        legacyHidden.push(parts[parts.length - 1]);
      });
      state.custom = dedupe(legacyCustom);
      // 旧的默认菜品名已不存在于新选项表，直接丢弃，避免脏数据
      state.hidden = dedupe(legacyHidden).filter(function (n) {
        return DEFAULT_ITEMS.indexOf(n) > -1;
      });
      saveState();
      try { localStorage.removeItem(KEY_LEGACY); } catch (e2) {}
    } catch (e) { state.custom = []; state.hidden = []; }
  }

  function saveState() {
    try { localStorage.setItem(KEY_DATA, JSON.stringify(state)); } catch (e) {}
  }
  function saveHistory() {
    try { localStorage.setItem(KEY_HIST, JSON.stringify(history)); } catch (e) {}
  }
  function loadHistory() {
    try {
      var raw = localStorage.getItem(KEY_HIST);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) history = dedupe(arr.map(normalizeName)).slice(0, 5);
    } catch (e) {}
  }

  /* ================= 选项集合（单一扁平列表） ================= */
  function allOptions() {
    var out = [];
    DEFAULT_ITEMS.forEach(function (n) {
      if (state.hidden.indexOf(n) === -1) out.push({ name: n, mine: false });
    });
    state.custom.forEach(function (n) {
      if (!DEFAULT_ITEMS.some(function (d) { return d === n; }) || state.hidden.indexOf(n) === -1) {
        if (!out.some(function (o) { return o.name === n; })) out.push({ name: n, mine: true });
      }
    });
    return out;
  }

  /* ================= 渲染 ================= */
  function renderItems() {
    var box = $('items');
    var list = allOptions();
    if (!list.length) {
      box.innerHTML = '<p class="empty-tip">选项空了，先添加几个想吃的吧。</p>';
      return;
    }
    var html = '';
    list.forEach(function (it) {
      html += '<span class="item' + (it.mine ? ' mine' : '') + '">' + esc(it.name) +
              '<button class="del" type="button" title="删除" data-name="' + esc(it.name) +
              '" data-mine="' + (it.mine ? '1' : '0') + '">×</button></span>';
    });
    box.innerHTML = html;
  }

  function updateCounts() {
    $('poolCount').textContent = '共 ' + allOptions().length + ' 个选项';
  }

  function renderHistory() {
    var box = $('history');
    if (!history.length) { box.innerHTML = ''; return; }
    var h = '最近抽到：';
    history.slice(0, 4).forEach(function (n) {
      h += '<span class="h-item">' + esc(n) + '</span>';
    });
    box.innerHTML = h;
  }

  function setReel(text) {
    var el = $('reelText');
    el.textContent = text;
    el.dataset.long = text.length > 8 ? '1' : '0';
  }

  /* ================= 抽取动效 ================= */
  function spin() {
    if (spinning) return;
    var pool = allOptions();
    if (!pool.length) {
      toast('先添加至少一个选项');
      return;
    }

    spinning = true;
    var btn = $('spinBtn');
    var wrap = $('reelWrap');
    var text = $('reelText');

    btn.disabled = true;
    btn.textContent = '抽 取 中…';
    wrap.classList.remove('done');
    wrap.classList.add('spinning');
    text.classList.remove('pop');
    $('tag').textContent = '正在抽取';
    $('reelCat').textContent = '';

    var start = performance.now();
    var duration = 2000 + Math.random() * 400;
    var last = 0;
    var lastIdx = -1;

    function step(now) {
      var t = Math.min(1, (now - start) / duration);
      var delay = 45 + 235 * Math.pow(t, 2.6); // 逐帧衰减的切换频率
      if (now - last >= delay) {
        last = now;
        var i;
        do { i = Math.floor(Math.random() * pool.length); }
        while (pool.length > 1 && i === lastIdx);
        lastIdx = i;
        setReel(pool[i].name);
      }
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        finish(pool);
      }
    }
    requestAnimationFrame(step);
  }

  function finish(pool) {
    var pick = pool[Math.floor(Math.random() * pool.length)];

    setReel(pick.name);
    var wrap = $('reelWrap');
    wrap.classList.remove('spinning');
    wrap.classList.add('done');
    $('tag').textContent = '就吃这个';
    $('reelCat').textContent = '从 ' + pool.length + ' 个选项里抽的';

    var text = $('reelText');
    text.classList.remove('pop');
    void text.offsetWidth;
    text.classList.add('pop');

    confetti();

    var btn = $('spinBtn');
    btn.disabled = false;
    btn.textContent = '再 抽 一 次';
    spinning = false;

    history.unshift(pick.name);
    history = dedupe(history).slice(0, 5);
    saveHistory();
    renderHistory();
  }

  /* ================= 撒花动效 ================= */
  var fx = $('fx');
  var ctx = fx.getContext('2d');
  var parts = [];
  var rafId = null;
  var COLORS = ['#ff6b35', '#ffa62b', '#22b573', '#3b82f6', '#a855f7', '#ec4899', '#facc15'];

  function resizeFx() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth;
    var h = window.innerHeight;
    fx.width = Math.floor(w * dpr);
    fx.height = Math.floor(h * dpr);
    fx.style.width = w + 'px';
    fx.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeFx);
  resizeFx();

  function confetti() {
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight * 0.36;
    for (var i = 0; i < 90; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 3 + Math.random() * 7.5;
      parts.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 3.2,
        g: 0.16 + Math.random() * 0.1,
        w: 4 + Math.random() * 6,
        h: 6 + Math.random() * 8,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 0.36,
        c: COLORS[Math.floor(Math.random() * COLORS.length)],
        life: 0,
        max: 66 + Math.random() * 40
      });
    }
    if (!rafId) rafId = requestAnimationFrame(loopFx);
  }

  function loopFx() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    var alive = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.life++;
      if (p.life >= p.max) continue;
      p.vy += p.g;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      alive.push(p);
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    parts = alive;
    if (parts.length) {
      rafId = requestAnimationFrame(loopFx);
    } else {
      rafId = null;
      ctx.clearRect(0, 0, w, h);
    }
  }

  /* ================= 主题 ================= */
  function syncThemeBtn() {
    var dark = document.documentElement.dataset.theme === 'dark';
    var btn = $('themeBtn');
    btn.textContent = dark ? '☀️' : '🌙';
    btn.title = dark ? '切换浅色模式' : '切换深色模式';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0e1116' : '#f4f6fb');
  }
  function toggleTheme() {
    var dark = document.documentElement.dataset.theme === 'dark';
    var next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(KEY_THEME, next); } catch (e) {}
    syncThemeBtn();
  }

  /* ================= 事件 ================= */
  function bind() {
    $('spinBtn').addEventListener('click', spin);
    $('themeBtn').addEventListener('click', toggleTheme);

    // 添加选项
    $('addForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = $('nameInput');
      var name = (input.value || '').trim().replace(/\s+/g, ' ');
      if (!name) { toast('先输入选项名称'); input.focus(); return; }
      if (name.length > 20) { toast('名称太长了'); return; }

      var exists = allOptions().some(function (it) { return it.name === name; });
      if (exists) { toast('「' + name + '」已经存在了'); return; }

      // 若该名称曾被隐藏，先解除隐藏
      var hi = state.hidden.indexOf(name);
      if (hi > -1) state.hidden.splice(hi, 1);
      else state.custom.push(name);

      saveState();
      input.value = '';
      renderItems();
      updateCounts();
      toast('已添加「' + name + '」');
    });

    // 删除选项（事件委托）
    $('items').addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.del') : null;
      if (!btn) return;
      var name = btn.getAttribute('data-name');
      var mine = btn.getAttribute('data-mine') === '1';

      if (mine) {
        state.custom = state.custom.filter(function (n) { return n !== name; });
      } else if (state.hidden.indexOf(name) === -1) {
        state.hidden.push(name);
      }
      saveState();
      renderItems();
      updateCounts();

      // 结果区同步
      if ($('reelText').textContent === name) {
        $('tag').textContent = '今天吃';
        setReel('再抽一次吧');
        $('reelCat').textContent = '';
        $('reelWrap').classList.remove('done');
        $('spinBtn').textContent = '开 始 抽 取';
      }
    });

    // 恢复默认
    $('restoreBtn').addEventListener('click', function () {
      if (!state.hidden.length && !state.custom.length) {
        toast('当前已经是默认选项');
        return;
      }
      state.hidden = [];
      saveState();
      renderItems();
      updateCounts();
      toast('已恢复默认 5 个选项');
    });

    // 空格快捷抽取
    document.addEventListener('keydown', function (e) {
      var tag = (document.activeElement && document.activeElement.tagName) || '';
      if (e.code === 'Space' && tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA' && !e.repeat) {
        e.preventDefault();
        spin();
      }
    });
  }

  /* ================= 初始化 ================= */
  function init() {
    loadState();
    loadHistory();
    renderItems();
    renderHistory();
    updateCounts();
    syncThemeBtn();
    bind();

    if (window.matchMedia) {
      try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (ev) {
          var saved = null;
          try { saved = localStorage.getItem(KEY_THEME); } catch (e) {}
          if (!saved) {
            document.documentElement.dataset.theme = ev.matches ? 'dark' : 'light';
            syncThemeBtn();
          }
        });
      } catch (e) {}
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
